# Deterministic glue for the pipeline-analysis agents. Agents emit only constrained safe outputs;
# deterministic jobs perform writes with either job-scoped GITHUB_TOKEN permissions or the
# repository's short-lived automation App token.
#
# Trust boundary: the analysis agent reads pull-request-controlled build logs, and the
# `**Automated fix:** eligible` line it writes is what escalates this workflow from "comment" to
# "generate code". That classification is therefore model output derived from untrusted input.
# Containment - not the classification - is what makes this safe: the fix agent may only write
# under sdk/, its work lands in a separate draft pull request, and a human decides whether to
# merge it. Do not widen the fix agent's allowed paths or auto-merge its output.
name: Pipeline Analysis Trigger

on:
  check_run:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      fix_pr:
        description: Monitor only this fix pull request, waiting for its CI to finish
        required: false
        type: string

permissions: {}

jobs:
  dispatch:
    # Azure Pipelines publishes a rollup check run per pipeline plus one per job; only job-level
    # names carry a ' (<job>)' suffix, so this filter keeps the rollups. React to rollups only.
    if: >
      vars.PIPELINE_ANALYSIS_ENABLED == 'true' &&
      github.event_name == 'check_run' &&
      github.event.check_run.check_suite.app.slug == 'azure-pipelines' &&
      !contains(github.event.check_run.name, ' (') &&
      (github.event.check_run.conclusion == 'failure' ||
       github.event.check_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 210
    concurrency:
      group: pipeline-analysis-dispatch-${{ github.event.check_run.head_sha }}
      cancel-in-progress: false
    outputs:
      fix_branch: ${{ steps.orchestrate.outputs.fix_branch }}
      original_pr: ${{ steps.orchestrate.outputs.original_pr }}
      original_sha: ${{ steps.orchestrate.outputs.original_sha }}
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Check out pipeline analysis helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Dispatch analysis and optional auto-fix
        id: orchestrate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          CHECK_NAME: Pipeline Analysis
          ANALYSIS_MARKER: "PR Pipeline Failure Analysis"
          ANALYSIS_MARKER_FALLBACK: "<!-- pipeline-analysis-comment -->"
          FIXABLE_MARKER: "**Automated fix:** eligible"
          FIX_SECTION_MARKER: "<!-- pipeline-analysis-fix -->"
        run: pwsh -File eng/scripts/Invoke-PipelineAnalysis.ps1 -Action Dispatch
      # The step above opens an in_progress check run and closes it in a finally block, which does
      # not run when the job is cancelled or hits its timeout. Close it here so the check does not
      # stay pending on the pull request forever.
      - name: Close a stranded analysis check run
        if: cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: pwsh -File eng/scripts/Invoke-PipelineAnalysis.ps1 -Action CloseCheck

  create-fix-pr:
    needs: dispatch
    if: >
      needs.dispatch.result == 'success' &&
      github.repository_owner == 'Azure' &&
      !github.event.repository.fork &&
      needs.dispatch.outputs.fix_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: AzureSDKEngKeyVault
    concurrency:
      group: pipeline-analysis-create-${{ needs.dispatch.outputs.fix_branch }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Check out trusted authentication action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: 5786d1fb-187e-4ca9-9a81-ab89ea278986
          tenant-id: 72f988bf-86f1-41af-91ab-2d7cd011db47
          subscription-id: a18897a6-7e44-457d-9260-f2854c0aca42
      - name: Mint Azure SDK Automation token
        uses: ./eng/common/actions/login-to-github
        with:
          token-owners: Azure
      - name: Create draft fix pull request
        id: create
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIX_BRANCH: ${{ needs.dispatch.outputs.fix_branch }}
          ORIGINAL_PR: ${{ needs.dispatch.outputs.original_pr }}
          ORIGINAL_SHA: ${{ needs.dispatch.outputs.original_sha }}
        run: pwsh -File eng/scripts/Invoke-PipelineAnalysis.ps1 -Action CreateFixPr
      - name: Report fix and start validation
        if: steps.create.outputs.fix_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ORIGINAL_PR: ${{ needs.dispatch.outputs.original_pr }}
          FIX_NUMBER: ${{ steps.create.outputs.fix_number }}
          FIX_URL: ${{ steps.create.outputs.fix_url }}
          ANALYSIS_MARKER: "PR Pipeline Failure Analysis"
          ANALYSIS_MARKER_FALLBACK: "<!-- pipeline-analysis-comment -->"
          FIX_SECTION_MARKER: "<!-- pipeline-analysis-fix -->"
        run: pwsh -File eng/scripts/Invoke-PipelineAnalysis.ps1 -Action ReportFixAndDispatchValidation

  validate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      checks: read
      contents: read
      pull-requests: write
    concurrency:
      group: pipeline-analysis-validate
      cancel-in-progress: false
    steps:
      - name: Check out pipeline analysis helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Report fixes whose CI has completed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_FIX_PR: ${{ inputs.fix_pr }}
          ANALYSIS_MARKER: "PR Pipeline Failure Analysis"
          ANALYSIS_MARKER_FALLBACK: "<!-- pipeline-analysis-comment -->"
          FIX_SECTION_MARKER: "<!-- pipeline-analysis-fix -->"
        run: pwsh -File eng/scripts/Invoke-PipelineAnalysis.ps1 -Action Validate

  cleanup:
    if: >
      (github.event_name == 'workflow_dispatch' && !inputs.fix_pr) ||
      github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out pipeline analysis helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Delete expired fix branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: pwsh -File eng/scripts/Invoke-PipelineAnalysis.ps1 -Action Cleanup