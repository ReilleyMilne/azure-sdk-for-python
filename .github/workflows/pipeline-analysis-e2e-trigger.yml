# Pipeline Analysis - deterministic glue.
#
# One plain workflow drives the whole loop so the agentic parts stay small:
#
#   dispatch  Azure Pipelines PR CI fails  -> run the analysis agent, then the auto-fix agent
#             once analysis has reported an actual failure, record the draft fix in the analysis
#             comment, then hand that fix to `validate`. One attempt per commit: re-running a
#             pipeline raises a fresh `check_run`, and the concurrency group and the
#             already-analysed check below stop that becoming a second fix pull request.
#   validate  Dispatched with a fix pull request -> wait for its CI, then act on it. On the
#             half-hourly cron -> sweep every open fix pull request without waiting, which
#             recovers anything the dispatched run missed.
#             Acting means: record the fix's CI results on the fix pull request, and if they are
#             green retarget it at the pull request it fixes and list the pipelines it fixed in
#             the analysis comment. If its CI failed, say so there instead and point the author
#             at `@copilot`.
#   cleanup   Daily -> delete generated fix branches that no longer back an open pull request.
#
# `validate` is reached by `workflow_dispatch` and cron rather than by the fix branch's
# `check_run`, because GitHub does not deliver `check_run` or `workflow_run` events for anything
# originating from GITHUB_TOKEN, which is every branch the auto-fix agent pushes.
# `workflow_dispatch` is the one exception that does work, so it carries the chain.
#
# It records CI results on the fix pull request before retargeting because changing the base
# makes Azure Pipelines re-run on the same commit, and the default latest-filtered check runs
# then report the re-run instead of the result that justified the retarget.
#
# The agents (pipeline-analysis-next-steps.md, pipeline-analysis-auto-fix.md) never call GitHub
# write APIs; every write below runs on the built-in GITHUB_TOKEN with a job-scoped permission
# set.
name: Pipeline Analysis Trigger E2E

on:
  check_run:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      fix_pr:
        description: Validate only this fix pull request, waiting for its CI to finish
        required: false
        type: string

permissions: {}

jobs:
  # The non-parenthesized "*- pullrequest" check is the Azure Pipelines rollup; the parenthesized
  # ones are its individual stages. Note that `check_suite.head_branch` is NOT usable as a filter
  # here: Azure Pipelines routinely reports it as null, so the branch checks below are done in
  # the scripts once the pull request has been resolved.
  dispatch:
    if: >
      github.event_name == 'check_run' &&
      github.event.check_run.check_suite.app.slug == 'azure-pipelines' &&
      endsWith(github.event.check_run.name, '- pullrequest') &&
      (github.event.check_run.conclusion == 'failure' ||
       github.event.check_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Re-running a pipeline produces a fresh `check_run` on the same commit, so without this a
    # retried failure would start a second analysis and a second auto-fix, and the fix branch
    # prefix contains the run id, so that second fix would open its own draft pull request.
    concurrency:
      group: pipeline-analysis-dispatch-${{ github.event.check_run.head_sha }}
      cancel-in-progress: false
    permissions:
      actions: write
      pull-requests: write
    steps:
      - name: Dispatch analysis and optional auto-fix
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          ANALYSIS_MARKER: PR Pipeline Failure Analysis
          FIX_SECTION_MARKER: "<!-- pipeline-analysis-fix -->"
        run: |
          set -euo pipefail

          # check_run.pull_requests is empty for pull requests from forks.
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(
              gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" \
                --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" |
                head -1
            )"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request found for $HEAD_SHA."
            exit 0
          fi

          pr="$(
            gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
              --json baseRefName,headRefName,headRefOid,isCrossRepository,isDraft
          )"
          if [ "$(jq -r '.headRefOid' <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "Skipping stale failure for PR #$PR_NUMBER."
            exit 0
          fi

          # A failing generated fix is handled by letting it expire, not by analyzing it again.
          case "$(jq -r '.headRefName' <<<"$pr")" in
            copilot-pipeline-fix/*)
              echo "Skipping generated fix PR #$PR_NUMBER."
              exit 0
              ;;
          esac

          context="$(printf '{"item_type":"pull_request","item_number":%s}' "$PR_NUMBER")"
          run_title="Pipeline Analysis / PR #$PR_NUMBER / $HEAD_SHA"

          # The concurrency group above serialises retries of the same commit; this is what makes
          # the second one a no-op rather than a duplicate attempt.
          existing="$(
            gh run list --repo "$REPOSITORY" \
              --workflow pipeline-analysis-next-steps.lock.yml --limit 100 \
              --json displayTitle \
              --jq "[.[] | select(.displayTitle == \"$run_title\")] | length"
          )"
          if [ "$existing" != 0 ]; then
            echo "PR #$PR_NUMBER has already been analysed at $HEAD_SHA."
            exit 0
          fi

          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pipeline-analysis-next-steps.lock.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f aw_context="$context" \
            -f pr_number="$PR_NUMBER" \
            -f ci_head_sha="$HEAD_SHA"
          echo "Dispatched analysis for PR #$PR_NUMBER."

          # Auto-fix pushes a branch and opens a draft pull request, so it is limited to pull
          # requests the author is actively asking for review on, from this repository.
          if [ "$(jq -r '.isDraft' <<<"$pr")" = true ]; then
            echo "Skipping auto-fix for draft PR #$PR_NUMBER."
            exit 0
          fi
          if [ "$(jq -r '.isCrossRepository' <<<"$pr")" = true ]; then
            echo "Skipping auto-fix for fork PR #$PR_NUMBER."
            exit 0
          fi

          # Auto-fix runs only after analysis has actually reported a failure, so a run that
          # diagnosed nothing does not spend a second agent opening a pull request, and the
          # fix is always appended to a comment that already exists.
          #
          # The two are chained by waiting for that comment rather than by a `workflow_run`
          # trigger, because GitHub suppresses `workflow_run` and `check_run` events for runs
          # started with GITHUB_TOKEN; an event-driven chain silently never fires. Verified on
          # this repository: a user-dispatched run delivered the event, a GITHUB_TOKEN-
          # dispatched one did not.
          echo "Waiting for the analysis comment on PR #$PR_NUMBER..."
          analysed=false
          for _ in $(seq 1 60); do
            sleep 20

            comments="$(
              gh api \
                "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100&sort=created&direction=desc" \
                --jq ".[] | select(.created_at > \"$dispatched_at\") | .body" 2>/dev/null || true
            )"
            case "$comments" in
              *"$ANALYSIS_MARKER"*)
                analysed=true
                break
                ;;
            esac

            # The comment is posted by a later job of the analysis run itself, so a run that has
            # finished without one diagnosed nothing and there is no point waiting out the poll.
            status="$(
              gh run list --repo "$REPOSITORY" \
                --workflow pipeline-analysis-next-steps.lock.yml --limit 30 \
                --json status,displayTitle \
                --jq "[.[] | select(.displayTitle == \"$run_title\")] | first | .status // empty"
            )"
            if [ "$status" = completed ]; then
              break
            fi
          done
          if [ "$analysed" != true ]; then
            echo "Analysis reported no failure for PR #$PR_NUMBER; skipping auto-fix."
            exit 0
          fi

          gh workflow run pipeline-analysis-auto-fix.lock.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f pr_number="$PR_NUMBER" \
            -f ci_head_sha="$HEAD_SHA" \
            -f validation_base_ref="$(jq -r '.baseRefName' <<<"$pr")"
          echo "Dispatched auto-fix for PR #$PR_NUMBER."

          # The attempt is reported as soon as the draft exists, without waiting on its CI, so
          # the author sees it immediately. `validate` is then handed the fix and completes the
          # note once CI has actually run.
          echo "Waiting for the auto-fix pull request..."
          fix_title="Pipeline Auto Fix / PR #$PR_NUMBER / $HEAD_SHA"
          fix=""
          for _ in $(seq 1 45); do
            sleep 20

            fix="$(
              gh pr list --repo "$REPOSITORY" --state open --limit 100 \
                --json number,url,headRefName \
                --jq "[.[] | select(.headRefName | startswith(\"copilot-pipeline-fix/pr-$PR_NUMBER-$HEAD_SHA/\"))] | first // empty | @json"
            )"
            [ -z "$fix" ] || break

            status="$(
              gh run list --repo "$REPOSITORY" \
                --workflow pipeline-analysis-auto-fix.lock.yml --limit 30 \
                --json status,displayTitle \
                --jq "[.[] | select(.displayTitle == \"$fix_title\")] | first | .status // empty"
            )"
            if [ "$status" = completed ]; then
              break
            fi
          done
          if [ -z "$fix" ]; then
            echo "Auto-fix produced no pull request for PR #$PR_NUMBER."
            exit 0
          fi
          fix_number="$(jq -r '.number' <<<"$fix")"
          fix_url="$(jq -r '.url' <<<"$fix")"

          {
            printf '%s\n\n' "$FIX_SECTION_MARKER"
            printf -- '---\n\n'
            printf '### Attempted Copilot Fix\n\n'
            printf 'PR: [#%s](%s) attempted to fix the pipeline failures found by the analysis.\n' \
              "$fix_number" "$fix_url"
            printf '\n**Next steps:** The draft PR'"'"'s pipelines are still running. This note '
            printf 'will be updated once they finish. Review the change now if you like, but wait '
            printf 'for that update before merging: until it passes, the draft targets the base '
            printf 'branch rather than this one.\n'
          } > addition.md

          comment_id="$(
            gh api \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100&sort=created&direction=desc" \
              --jq "[.[] | select(.body | contains(\"$ANALYSIS_MARKER\"))] | first | .id // empty"
          )"
          if [ -z "$comment_id" ]; then
            echo "Analysis comment disappeared from PR #$PR_NUMBER."
            exit 0
          fi

          gh api "repos/$REPOSITORY/issues/comments/$comment_id" --jq '.body' > body.md
          awk -v marker="$FIX_SECTION_MARKER" 'index($0, marker) { exit } { print }' \
            body.md > trimmed.md
          cat trimmed.md addition.md > updated.md
          jq -Rs '{body: .}' updated.md |
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
          echo "Reported $fix_url in analysis comment $comment_id."

          # Hand the fix to `validate` rather than waiting on its CI here, which would hold this
          # runner for the whole of that CI. `workflow_dispatch` is used because it is the only
          # trigger GitHub still delivers for work originating from GITHUB_TOKEN.
          gh workflow run pipeline-analysis-e2e-trigger.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f fix_pr="$fix_number"
          echo "Dispatched validation for fix pull request #$fix_number."

  # A generated fix targets the original pull request's base branch first, purely so Azure
  # Pipelines will run against it. Only once that CI is green is it retargeted at the pull
  # request it is meant to fix.
  #
  # `dispatch` hands each new fix straight here, and this job waits for that one fix's CI. The
  # half-hourly cron is the backstop: it sweeps every open fix without waiting, so a fix whose
  # dispatched run timed out or was cancelled is still picked up.
  validate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      checks: read
      pull-requests: write
    concurrency:
      group: pipeline-analysis-validate
      cancel-in-progress: false
    steps:
      - name: Retarget fixes whose CI has gone green
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_FIX_PR: ${{ inputs.fix_pr }}
          ANALYSIS_MARKER: PR Pipeline Failure Analysis
          FIX_SECTION_MARKER: "<!-- pipeline-analysis-fix -->"
          EVIDENCE_MARKER: "<!-- pipeline-analysis-ci-evidence -->"
        run: |
          set -euo pipefail

          rollups() {
            gh api --paginate "repos/$REPOSITORY/commits/$1/check-runs?per_page=100" \
              --jq '.check_runs[]
                    | select(.app.slug == "azure-pipelines")
                    | select(.name | endswith("- pullrequest"))
                    | [.name, .status, .conclusion]
                    | @tsv'
          }

          # tsv columns: result, name, url, started. Rendered newest-last.
          rows() {
            sort -t"$(printf '\t')" -k4 "$1" |
              awk -F'\t' -v source="$2" '
                {
                  icon = "⏳"
                  if ($1 == "success") icon = "✅"
                  else if ($1 == "failure" || $1 == "timed_out") icon = "❌"
                  else if ($1 == "queued" || $1 == "in_progress" || $1 == "waiting" ||
                           $1 == "pending" || $1 == "requested") icon = "⏳"
                  else icon = "⚠️"
                  printf "| %s %s | [%s](%s) | %s | %s |\n", icon, $1, $2, $3, source, substr($4, 1, 16)
                }'
          }

          # The record of what CI actually said while the fix was still targeting the validation
          # branch. Retargeting makes Azure Pipelines re-run on the same commit and the default
          # `filter=latest` check-runs view then reports the re-run instead, so without this the
          # evidence that justified the retarget is not visible anywhere.
          write_evidence() {
            local fix_pr="$1" fix_sha="$2" base_ref="$3" original_ref="$4" frozen="$5"
            local comment_id

            gh api --paginate "repos/$REPOSITORY/commits/$fix_sha/check-runs?per_page=100" \
              --jq '.check_runs[]
                    | select(.app.slug == "azure-pipelines")
                    | [(.conclusion // .status), .name, .html_url, .started_at]
                    | @tsv' > ado.tsv
            gh api --paginate "repos/$REPOSITORY/actions/runs?head_sha=$fix_sha&per_page=100" \
              --jq '.workflow_runs[]
                    | [(.conclusion // .status), .name, .html_url, .created_at]
                    | @tsv' > gha.tsv

            {
              printf '%s\n' "$EVIDENCE_MARKER"
              if [ "$frozen" = true ]; then
                printf '### CI results before retargeting\n\n'
              else
                printf '### CI results on the validation branch\n\n'
              fi
              printf 'Commit `%s`, checked while this pull request targeted `%s`.\n\n' \
                "$fix_sha" "$base_ref"
              printf '| Result | Check | Source | Started (UTC) |\n'
              printf '|---|---|---|---|\n'
              rows ado.tsv "Azure Pipelines"
              rows gha.tsv "GitHub Actions"
              printf '\n'
              if [ "$frozen" = true ]; then
                printf '> [!IMPORTANT]\n'
                printf '> These are the results that gated the retarget. This pull request has\n'
                printf '> since been retargeted from `%s` to `%s`, which makes Azure Pipelines\n' \
                  "$base_ref" "$original_ref"
                printf '> re-run on the same commit against a different base. **The checks shown\n'
                printf '> on this pull request now come from that re-run and will not match the\n'
                printf '> table above.** The table is the record; the live checks are not.\n'
              else
                printf 'This draft targets `%s` only so Azure Pipelines will run against it. ' \
                  "$base_ref"
                printf 'Once every pipeline that failed on the original pull request passes here, '
                printf 'it is retargeted and this table is frozen as the record of that result.\n'
              fi
            } > evidence.md

            comment_id="$(
              gh api \
                "repos/$REPOSITORY/issues/$fix_pr/comments?per_page=100&sort=created&direction=desc" \
                --jq "[.[] | select(.body | contains(\"$EVIDENCE_MARKER\"))] | first | .id // empty"
            )"
            if [ -z "$comment_id" ]; then
              gh pr comment "$fix_pr" --repo "$REPOSITORY" --body-file evidence.md >/dev/null
              return 0
            fi

            # The sweep runs 48 times a day; only edit when something actually changed, so the
            # comment is not marked edited on every pass.
            gh api "repos/$REPOSITORY/issues/comments/$comment_id" --jq '.body' > existing.md
            if [ "$(cat existing.md)" = "$(cat evidence.md)" ]; then
              return 0
            fi
            jq -Rs '{body: .}' evidence.md |
              gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
          }

          # Rewrites the fix section of the analysis comment in place, so the pull request keeps
          # one pipeline-analysis thread however many times the fix's state changes.
          set_fix_section() {
            local original_pr="$1" addition="$2" comment_id

            comment_id="$(
              gh api \
                "repos/$REPOSITORY/issues/$original_pr/comments?per_page=100&sort=created&direction=desc" \
                --jq "[.[] | select(.body | contains(\"$ANALYSIS_MARKER\"))] | first | .id // empty"
            )"
            if [ -z "$comment_id" ]; then
              if [ -s "$addition" ]; then
                gh pr comment "$original_pr" --repo "$REPOSITORY" --body-file "$addition" >/dev/null
                echo "  posted a new comment on PR #$original_pr."
              fi
              return 0
            fi

            gh api "repos/$REPOSITORY/issues/comments/$comment_id" --jq '.body' > body.md
            awk -v marker="$FIX_SECTION_MARKER" 'index($0, marker) { exit } { print }' \
              body.md > trimmed.md
            cat trimmed.md "$addition" > updated.md
            if [ "$(cat updated.md)" = "$(cat body.md)" ]; then
              return 0
            fi
            jq -Rs '{body: .}' updated.md |
              gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
            echo "  updated analysis comment $comment_id on PR #$original_pr."
          }

          # Returns 0 unconditionally: one unfinished fix must not fail the whole sweep.
          validate_fix() {
            local fix="$1" fix_pr fix_ref fix_sha base_ref original_pr original_sha
            local original original_ref failed_pipelines validated pipeline result

            fix_pr="$(jq -r '.number' <<<"$fix")"
            fix_ref="$(jq -r '.headRefName' <<<"$fix")"
            fix_sha="$(jq -r '.headRefOid' <<<"$fix")"
            base_ref="$(jq -r '.baseRefName' <<<"$fix")"

            if ! [[ "$fix_ref" =~ ^copilot-pipeline-fix/pr-([0-9]+)-([0-9a-f]{40})/ ]]; then
              return 0
            fi
            original_pr="${BASH_REMATCH[1]}"
            original_sha="${BASH_REMATCH[2]}"

            original="$(
              gh pr view "$original_pr" --repo "$REPOSITORY" \
                --json headRefName,headRefOid,state
            )"
            original_ref="$(jq -r '.headRefName' <<<"$original")"

            # Already retargeted: the evidence comment is frozen and must not be refreshed,
            # because the live checks are now the post-retarget re-run.
            if [ "$base_ref" = "$original_ref" ]; then
              return 0
            fi

            if [ "$(jq -r '.state' <<<"$original")" != OPEN ] ||
               [ "$(jq -r '.headRefOid' <<<"$original")" != "$original_sha" ]; then
              echo "#$fix_pr: original PR #$original_pr is closed or has moved past $original_sha."
              return 0
            fi

            write_evidence "$fix_pr" "$fix_sha" "$base_ref" "$original_ref" false

            rollups "$original_sha" > original-rollups.tsv
            rollups "$fix_sha" > fix-rollups.tsv

            # Every rollup that failed on the original commit has to be green on the fix, and the
            # fix must not have broken a rollup that was previously passing.
            if awk -F'\t' '$3 == "failure" || $3 == "timed_out" { found = 1 } END { exit !found }' \
                 fix-rollups.tsv; then
              {
                printf '%s\n\n' "$FIX_SECTION_MARKER"
                printf -- '---\n\n'
                printf '### Attempted Copilot Fix\n\n'
                printf 'PR: [#%s](%s) attempted to fix the pipeline failures found by the ' \
                  "$fix_pr" "$(jq -r '.url' <<<"$fix")"
                printf 'analysis, but failed.\n'
                printf '\n**Next steps:** Review the analysis above, or comment '
                printf '`@copilot fix the pipeline failures` on this pull request to have Copilot '
                printf 'try again.\n'
              } > addition.md

              echo "#$fix_pr: still has a failing pipeline."
              set_fix_section "$original_pr" addition.md
              return 0
            fi

            failed_pipelines="$(
              awk -F'\t' '$2 == "completed" && ($3 == "failure" || $3 == "timed_out") { print $1 }' \
                original-rollups.tsv
            )"
            if [ -z "$failed_pipelines" ]; then
              echo "#$fix_pr: no failed rollups recorded on $original_sha; nothing to validate."
              return 0
            fi

            validated=""
            while IFS= read -r pipeline; do
              [ -n "$pipeline" ] || continue
              result="$(
                awk -F'\t' -v name="$pipeline" \
                  '$1 == name && $2 == "completed" { print $3; exit }' fix-rollups.tsv
              )"
              if [ "$result" != success ]; then
                echo "#$fix_pr: '$pipeline' has not passed on the fix branch yet."
                return 0
              fi
              validated="${validated}- \`${pipeline}\`"$'\n'
            done <<<"$failed_pipelines"

            # Freeze the evidence before retargeting, not after: the re-run starts within
            # seconds of the base change and overwrites the latest-filtered check runs.
            write_evidence "$fix_pr" "$fix_sha" "$base_ref" "$original_ref" true

            gh api -X PATCH "repos/$REPOSITORY/pulls/$fix_pr" -f base="$original_ref" >/dev/null

            # Complete the "attempted a fix" note the dispatch job already wrote, so the pull
            # request keeps a single pipeline-analysis thread.
            {
              printf '%s\n\n' "$FIX_SECTION_MARKER"
              printf -- '---\n\n'
              printf '### Attempted Copilot Fix\n\n'
              printf 'PR: [#%s](%s) attempted to fix the pipeline failures found by the ' \
                "$fix_pr" "$(jq -r '.url' <<<"$fix")"
              printf 'analysis. It successfully fixed the following pipelines:\n\n'
              printf '%s' "$validated"
              printf '\n**Next steps:** Review the change and merge it into this branch to pick '
              printf 'up the fix.\n'
            } > addition.md

            echo "#$fix_pr: validated."
            set_fix_section "$original_pr" addition.md
            return 0
          }

          if [ -n "$TARGET_FIX_PR" ]; then
            # Dispatched by `dispatch` for one specific fix. Azure Pipelines has not necessarily
            # even queued yet, so wait for its rollups to finish before judging them.
            echo "Waiting for CI on fix pull request #$TARGET_FIX_PR..."
            for _ in $(seq 1 120); do
              sha="$(
                gh pr view "$TARGET_FIX_PR" --repo "$REPOSITORY" --json headRefOid \
                  --jq '.headRefOid'
              )"
              rollups "$sha" > target-rollups.tsv
              if [ -s target-rollups.tsv ] &&
                 ! awk -F'\t' '$2 != "completed" { found = 1 } END { exit !found }' \
                     target-rollups.tsv; then
                echo "All $(wc -l < target-rollups.tsv) pipeline rollups have completed."
                break
              fi
              sleep 30
            done

            gh pr view "$TARGET_FIX_PR" --repo "$REPOSITORY" \
              --json number,baseRefName,headRefName,headRefOid,url,state \
              --jq 'select(.state == "OPEN")
                    | {number, baseRefName, headRefName, headRefOid, url}
                    | @json' > candidates.jsonl
          else
            gh pr list --repo "$REPOSITORY" --state open --limit 100 \
              --json number,baseRefName,headRefName,headRefOid,url \
              --jq '.[] | select(.headRefName | startswith("copilot-pipeline-fix/")) | @json' \
              > candidates.jsonl
          fi
          echo "Checking $(wc -l < candidates.jsonl) open fix pull requests."

          while IFS= read -r fix; do
            [ -n "$fix" ] || continue
            validate_fix "$fix"
          done < candidates.jsonl

  # Auto-fix branches are cheap to recreate, so anything without an open pull request is dropped
  # after a week rather than left to accumulate.
  cleanup:
    if: >
      (github.event_name == 'workflow_dispatch' && !inputs.fix_pr) ||
      github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete expired fix branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff="$(( $(date -u +%s) - 7 * 86400 ))"

          gh api --paginate \
            "repos/$REPOSITORY/git/matching-refs/heads/copilot-pipeline-fix/" \
            --jq '.[].ref' |
            sed 's#^refs/heads/##' |
            while read -r branch; do
              [ -n "$branch" ] || continue

              open_prs="$(
                gh pr list --repo "$REPOSITORY" --state open \
                  --head "$branch" --json number --jq length
              )"
              if [ "$open_prs" -gt 0 ]; then
                echo "keep   $branch (open PR)"
                continue
              fi

              committed="$(
                gh api "repos/$REPOSITORY/commits/$branch" \
                  --jq '.commit.committer.date' 2>/dev/null || true
              )"
              [ -n "$committed" ] || continue
              if [ "$(date -u -d "$committed" +%s)" -ge "$cutoff" ]; then
                echo "keep   $branch ($committed)"
                continue
              fi

              gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
              echo "delete $branch ($committed)"
            done
