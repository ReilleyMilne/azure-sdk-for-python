name: Probe C
on:
  workflow_dispatch:
    inputs:
      pr:
        required: true
permissions: {}
jobs:
  c:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Can pull-requests write edit an issue comment?
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          id="$(gh api "repos/$REPOSITORY/issues/$PR/comments" \
                 -f body='probe-c: created' --jq '.id')"
          echo "created comment $id"
          jq -Rns '{body: "probe-c: EDITED OK"}' |
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$id" --input - >/dev/null
          echo "PATCH succeeded"
          gh api "repos/$REPOSITORY/issues/comments/$id" --jq '.body'
          gh api -X DELETE "repos/$REPOSITORY/issues/comments/$id"
          echo "cleaned up"
