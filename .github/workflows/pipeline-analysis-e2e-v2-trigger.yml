# Deterministic glue for the pipeline-analysis agents. Agents emit only constrained safe outputs;
# deterministic jobs perform writes with either job-scoped GITHUB_TOKEN permissions or the
# repository's short-lived automation App token.
#
#   dispatch       Failed Azure Pipelines CI -> analysis agent, then auto-fix agent.
#   create-fix-pr  Open the generated branch with the repository's GitHub App.
#   validate       Retarget a fix after all of its default-branch pipelines pass.
#   cleanup        Drop fix branches that no longer back an open pull request.
#
# `validate` runs on workflow_dispatch and cron rather than on the fix branch's `check_run`:
# GitHub suppresses check_run and workflow_run events for commits pushed with GITHUB_TOKEN, so
# an event-driven chain silently never fires. workflow_dispatch is the one exception.
#
# Dormant until the repository variable PIPELINE_ANALYSIS_ENABLED is set to 'true'. Only
# `dispatch` is gated, so clearing it stops new work while fixes already in flight still drain.
name: Pipeline Analysis Trigger

on:
  check_run:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      fix_pr:
        description: Monitor only this fix pull request, waiting for its CI to finish
        required: false
        type: string

permissions: {}

jobs:
  # Azure Pipelines stages append " (<stage>)" to their parent check's name.
  # check_suite.head_branch is unusable as a filter here - Azure Pipelines often reports it null.
  dispatch:
    if: >
      vars.PIPELINE_ANALYSIS_ENABLED == 'true' &&
      github.event_name == 'check_run' &&
      github.event.check_run.check_suite.app.slug == 'azure-pipelines' &&
      !contains(github.event.check_run.name, ' (') &&
      (github.event.check_run.conclusion == 'failure' ||
       github.event.check_run.conclusion == 'timed_out')
    runs-on: ubuntu-latest
    timeout-minutes: 110
    # A pipeline re-run raises a fresh check run on the same commit; serialise so a retry
    # cannot open a second fix pull request.
    concurrency:
      group: pipeline-analysis-dispatch-${{ github.event.check_run.head_sha }}
      cancel-in-progress: false
    outputs:
      fix_branch: ${{ steps.orchestrate.outputs.fix_branch }}
      original_pr: ${{ steps.orchestrate.outputs.original_pr }}
      original_sha: ${{ steps.orchestrate.outputs.original_sha }}
    permissions:
      actions: write
      checks: write
      contents: read
      pull-requests: write
    steps:
      - name: Dispatch analysis and optional auto-fix
        id: orchestrate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.check_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.check_run.head_sha }}
          CHECK_NAME: Pipeline Analysis
          ANALYSIS_MARKER: "PR Pipeline Failure Analysis"
          FIX_SECTION_MARKER: "<!-- pipeline-analysis-fix -->"
        run: |
          set -euo pipefail
          # shellcheck disable=SC2129

          # check_run.pull_requests is empty for fork pull requests. Take the most recently
          # updated match; awk, not `head -1`, which SIGPIPEs the paginating gh.
          if [ -z "$PR_NUMBER" ]; then
            PR_NUMBER="$(
              gh api --paginate "repos/$REPOSITORY/pulls?state=open&per_page=100" \
                --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | [.updated_at, .number] | @tsv" |
                sort -r |
                awk -F'\t' 'NR == 1 { print $2 }'
            )"
          fi
          if [ -z "$PR_NUMBER" ]; then
            echo "No open pull request found for $HEAD_SHA."
            exit 0
          fi

          pr="$(
            gh pr view "$PR_NUMBER" --repo "$REPOSITORY" \
              --json baseRefName,headRefName,headRefOid,isCrossRepository,isDraft
          )"
          if [ "$(jq -r '.headRefOid' <<<"$pr")" != "$HEAD_SHA" ]; then
            echo "Skipping stale failure for PR #$PR_NUMBER."
            exit 0
          fi

          head_ref="$(jq -r '.headRefName' <<<"$pr")"

          # A failing generated fix is left to expire rather than analysed again.
          case "$head_ref" in
            copilot-pipeline-fix/*)
              echo "Skipping generated fix PR #$PR_NUMBER."
              exit 0
              ;;
          esac

          # A service pipeline can finish long before its siblings. Every parent completion
          # raises this job, but only the first one that observes the final suite state proceeds.
          suites_complete=false
          for _ in $(seq 1 20); do
            suite_statuses="$(
              gh api --paginate \
                "repos/$REPOSITORY/commits/$HEAD_SHA/check-suites?per_page=100" \
                --jq '.check_suites[]
                      | select(.app.slug == "azure-pipelines")
                      | .status'
            )"
            if [ -n "$suite_statuses" ] &&
               ! awk '$1 != "completed" { incomplete = 1 } END { exit !incomplete }' \
                 <<<"$suite_statuses"; then
              suites_complete=true
              break
            fi
            sleep 30
          done
          if [ "$suites_complete" != true ]; then
            echo "Azure Pipelines is still registering or running checks for $HEAD_SHA."
            exit 0
          fi

          failed_rollups="$(
            gh api --paginate "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq '.check_runs[]
                    | select(.app.slug == "azure-pipelines")
                    | select(.name | contains(" (") | not)
                    | select(.conclusion == "failure" or .conclusion == "timed_out")
                    | .name'
          )"
          if [ -z "$failed_rollups" ]; then
            echo "All completed Azure Pipelines rollups passed for $HEAD_SHA."
            exit 0
          fi

          context="$(printf '{"item_type":"pull_request","item_number":%s}' "$PR_NUMBER")"
          run_title="Pipeline Analysis / PR #$PR_NUMBER / $HEAD_SHA"
          run_url="${GITHUB_SERVER_URL:-https://github.com}/$REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          # One check run per commit is both the dedup key and the progress indicator on the
          # pull request. Unlike scanning recent workflow runs, this cannot roll over.
          completed="$(
            gh api --paginate "repos/$REPOSITORY/commits/$HEAD_SHA/check-runs?per_page=100" \
              --jq ".check_runs[]
                    | select(.name == \"$CHECK_NAME\")
                    | select(.status == \"completed\" and .conclusion == \"success\")
                    | .id"
          )"
          if [ -n "$completed" ]; then
            echo "PR #$PR_NUMBER has already been analysed at $HEAD_SHA."
            exit 0
          fi

          check_id="$(
            gh api -X POST "repos/$REPOSITORY/check-runs" \
              -f name="$CHECK_NAME" \
              -f head_sha="$HEAD_SHA" \
              -f status=in_progress \
              -f details_url="$run_url" \
              -f 'output[title]=Analysing the failed pipeline' \
              -f "output[summary]=See $run_url" \
              --jq '.id'
          )"

          # Never conclude `failure`: a red check from tooling would block the author's merge.
          check_conclusion=neutral
          check_title="Analysis did not complete"
          check_summary="See $run_url"
          conclude() {
            gh api -X PATCH "repos/$REPOSITORY/check-runs/$check_id" \
              -f status=completed \
              -f conclusion="$check_conclusion" \
              -f "output[title]=$check_title" \
              -f "output[summary]=$check_summary" >/dev/null
          }
          trap conclude EXIT

          dispatched_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run pipeline-analysis-next-steps.lock.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f aw_context="$context" \
            -f pr_number="$PR_NUMBER" \
            -f ci_head_sha="$HEAD_SHA"
          echo "Dispatched analysis for PR #$PR_NUMBER."
          check_title="Analysis dispatched"

          # Auto-fix pushes a branch and opens a pull request, so restrict it to non-draft,
          # same-repo pull requests.
          if [ "$(jq -r '.isDraft' <<<"$pr")" = true ]; then
            echo "Skipping auto-fix for draft PR #$PR_NUMBER."
            check_conclusion=success
            check_title="Analysis dispatched; auto-fix skipped for draft"
            exit 0
          fi
          if [ "$(jq -r '.isCrossRepository' <<<"$pr")" = true ]; then
            echo "Skipping auto-fix for fork PR #$PR_NUMBER."
            check_conclusion=success
            check_title="Analysis dispatched; auto-fix skipped for fork"
            exit 0
          fi

          # Chained by polling for the analysis comment rather than by a workflow_run trigger,
          # which GitHub does not deliver for runs started with GITHUB_TOKEN. Doubles as the
          # check that analysis found something worth fixing.
          echo "Waiting for the analysis comment on PR #$PR_NUMBER..."
          analysed=false
          analysis_status=""
          analysis_conclusion=""
          for _ in $(seq 1 120); do
            sleep 20

            comments="$(
              gh api --paginate \
                "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
                --jq ".[] | select(.user.login == \"github-actions[bot]\")
                      | select(.created_at > \"$dispatched_at\")
                      | .body" 2>/dev/null || true
            )"
            case "$comments" in
              *"$ANALYSIS_MARKER"*)
                analysed=true
                break
                ;;
            esac

            # A finished run with no comment diagnosed nothing.
            run_state="$(
              gh run list --repo "$REPOSITORY" \
                --workflow pipeline-analysis-next-steps.lock.yml --limit 100 \
                --json conclusion,status,displayTitle \
                --jq "[.[] | select(.displayTitle == \"$run_title\")] | first
                      | [.status // \"\", .conclusion // \"\"] | @tsv"
            )"
            IFS=$'\t' read -r analysis_status analysis_conclusion <<<"$run_state"
            if [ "$analysis_status" = completed ]; then
              break
            fi
          done
          if [ "$analysed" != true ]; then
            if [ "$analysis_status" = completed ] && [ "$analysis_conclusion" = success ]; then
              echo "Analysis reported no actionable failure for PR #$PR_NUMBER."
              check_conclusion=success
              check_title="No actionable pipeline failure found"
            else
              echo "Analysis did not complete successfully for PR #$PR_NUMBER."
              check_title="Analysis incomplete; a pipeline rerun can retry"
              check_summary="The analysis workflow ended with status '$analysis_status' and conclusion '$analysis_conclusion'. See $run_url"
            fi
            exit 0
          fi
          check_conclusion=success
          check_title="Analysis posted"
          check_summary="Next steps posted on PR #$PR_NUMBER. See $run_url"

          gh workflow run pipeline-analysis-auto-fix.lock.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f aw_context="$context" \
            -f pr_number="$PR_NUMBER" \
            -f ci_head_sha="$HEAD_SHA" \
            -f parent_run_id="$GITHUB_RUN_ID"
          echo "Dispatched auto-fix for PR #$PR_NUMBER."

          # Report the attempt before its CI runs; `validate` completes the note afterwards.
          echo "Waiting for the auto-fix pull request..."
          fix_title="Pipeline Auto Fix / PR #$PR_NUMBER / $HEAD_SHA / Parent $GITHUB_RUN_ID"
          fix=""
          fix_run_id=""
          for _ in $(seq 1 105); do
            sleep 20

            fix="$(
              gh pr list --repo "$REPOSITORY" --state open --limit 100 \
                --json number,url,headRefName \
                --jq "[.[] | select(.headRefName | startswith(\"copilot-pipeline-fix/pr-$PR_NUMBER-$HEAD_SHA/\"))] | first // empty | @json"
            )"
            [ -z "$fix" ] || break

            run_state="$(
              gh run list --repo "$REPOSITORY" \
                --workflow pipeline-analysis-auto-fix.lock.yml --limit 100 \
                --json conclusion,databaseId,status,displayTitle \
                --jq "[.[] | select(.displayTitle == \"$fix_title\")] | first
                      | [.status // \"\", .conclusion // \"\", (.databaseId // \"\")] | @tsv"
            )"
            IFS=$'\t' read -r status _ fix_run_id <<<"$run_state"
            if [ "$status" = completed ]; then
              break
            fi
          done
          if [ -z "$fix" ]; then
            fix_branch=""
            if [ -n "$fix_run_id" ]; then
              prefix="copilot-pipeline-fix/pr-$PR_NUMBER-$HEAD_SHA/run-$fix_run_id/"
              fix_branch="$(
                gh api --paginate \
                  "repos/$REPOSITORY/git/matching-refs/heads/$prefix" \
                  --jq '.[0].ref // empty' 2>/dev/null |
                  sed 's#^refs/heads/##'
              )"
            fi
            if [ -z "$fix_branch" ]; then
              echo "Auto-fix produced neither a pull request nor a branch for PR #$PR_NUMBER."
              exit 0
            fi

            # Azure blocks GITHUB_TOKEN from opening pull requests. Hand the branch to the
            # narrowly scoped OIDC job below, which mints the existing automation App token.
            printf 'fix_branch=%s\n' "$fix_branch" >> "$GITHUB_OUTPUT"
            printf 'original_pr=%s\n' "$PR_NUMBER" >> "$GITHUB_OUTPUT"
            printf 'original_sha=%s\n' "$HEAD_SHA" >> "$GITHUB_OUTPUT"
            check_title="Analysis posted, fix branch ready"
            check_summary="Next steps posted on PR #$PR_NUMBER; generated branch $fix_branch"
            echo "Handing $fix_branch to the GitHub App pull-request job."
            exit 0
          fi
          fix_number="$(jq -r '.number' <<<"$fix")"
          fix_url="$(jq -r '.url' <<<"$fix")"
          check_title="Analysis posted, fix drafted"
          check_summary="Next steps posted on PR #$PR_NUMBER; draft fix $fix_url"

          {
            printf '%s\n\n' "$FIX_SECTION_MARKER"
            printf -- '---\n\n'
            printf '### Attempted Copilot Fix\n\n'
            printf 'PR: [#%s](%s) attempted to fix the pipeline failures found by the analysis.\n' \
              "$fix_number" "$fix_url"
            printf '\n**Next steps:** Its pipelines are still running and this note will be '
            printf 'updated once they finish. The draft temporarily targets the default branch '
            printf 'so Azure Pipelines runs; wait for validation and retargeting before merging.\n'
          } > addition.md

          comment_id="$(
            gh api --paginate \
              "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\")
                    | select(.body | contains(\"$ANALYSIS_MARKER\"))
                    | [.created_at, .id] | @tsv" |
              sort -r |
              awk -F'\t' 'NR == 1 { print $2 }'
          )"
          if [ -z "$comment_id" ]; then
            echo "Analysis comment disappeared from PR #$PR_NUMBER."
            exit 0
          fi

          gh api "repos/$REPOSITORY/issues/comments/$comment_id" --jq '.body' > body.md
          awk -v marker="$FIX_SECTION_MARKER" 'index($0, marker) { exit } { print }' \
            body.md > trimmed.md
          cat trimmed.md addition.md > updated.md
          jq -Rs '{body: .}' updated.md |
            gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
          echo "Reported $fix_url in analysis comment $comment_id."

          # Hand off rather than wait here, which would hold this runner for the whole CI run.
          gh workflow run pipeline-analysis-e2e-v2-trigger.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f fix_pr="$fix_number"
          echo "Dispatched validation for fix pull request #$fix_number."

  # The organization blocks GITHUB_TOKEN from opening pull requests. This job runs only when the
  # agent left a generated branch behind, and uses the repository's existing short-lived App path.
  create-fix-pr:
    needs: dispatch
    if: >
      needs.dispatch.result == 'success' &&
      github.repository == 'Azure/azure-sdk-for-python' &&
      needs.dispatch.outputs.fix_branch != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: AzureSDKEngKeyVault
    concurrency:
      group: pipeline-analysis-create-${{ needs.dispatch.outputs.fix_branch }}
      cancel-in-progress: false
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - name: Check out trusted authentication action
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Log in to Azure
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: 5786d1fb-187e-4ca9-9a81-ab89ea278986
          tenant-id: 72f988bf-86f1-41af-91ab-2d7cd011db47
          subscription-id: a18897a6-7e44-457d-9260-f2854c0aca42

      - name: Mint Azure SDK Automation token
        uses: ./eng/common/actions/login-to-github
        with:
          token-owners: Azure

      - name: Create draft fix pull request
        id: create
        env:
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FIX_BRANCH: ${{ needs.dispatch.outputs.fix_branch }}
          ORIGINAL_PR: ${{ needs.dispatch.outputs.original_pr }}
          ORIGINAL_SHA: ${{ needs.dispatch.outputs.original_sha }}
        run: |
          set -euo pipefail

          expected_prefix="copilot-pipeline-fix/pr-$ORIGINAL_PR-$ORIGINAL_SHA/run-"
          case "$FIX_BRANCH" in
            "$expected_prefix"*) ;;
            *) echo "::error::Unexpected generated branch '$FIX_BRANCH'."; exit 1 ;;
          esac

          original="$(
            gh pr view "$ORIGINAL_PR" --repo "$REPOSITORY" \
              --json headRefOid,isCrossRepository,isDraft,state
          )"
          if [ "$(jq -r '.state' <<<"$original")" != OPEN ] ||
             [ "$(jq -r '.headRefOid' <<<"$original")" != "$ORIGINAL_SHA" ] ||
             [ "$(jq -r '.isDraft' <<<"$original")" = true ] ||
             [ "$(jq -r '.isCrossRepository' <<<"$original")" = true ]; then
            echo "::notice::Original PR #$ORIGINAL_PR is no longer eligible; leaving the branch."
            exit 0
          fi

          comparison="$(
            gh api "repos/$REPOSITORY/compare/$ORIGINAL_SHA...$FIX_BRANCH"
          )"
          if [ "$(jq -r '.merge_base_commit.sha' <<<"$comparison")" != "$ORIGINAL_SHA" ] ||
             [ "$(jq -r '.status' <<<"$comparison")" != ahead ]; then
            echo "::error::$FIX_BRANCH is not a non-empty descendant of $ORIGINAL_SHA."
            exit 1
          fi
          if jq -e '.files[] | select(.filename | startswith("sdk/") | not)' \
               >/dev/null <<<"$comparison"; then
            echo "::error::$FIX_BRANCH contains changes outside sdk/."
            exit 1
          fi

          fix_url="$(
            gh pr list --repo "$REPOSITORY" --state open --head "$FIX_BRANCH" --limit 1 \
              --json url --jq '.[0].url // empty'
          )"
          if [ -z "$fix_url" ]; then
            cat > pr-body.md <<EOF
          Automated attempt to fix pipeline failures on #$ORIGINAL_PR at \`$ORIGINAL_SHA\`.

          This draft was generated by the pipeline analysis workflow. Its checks run against
          \`$DEFAULT_BRANCH\`; after validation, the workflow retargets it to the original branch.
          EOF
            fix_url="$(
              gh pr create --repo "$REPOSITORY" \
                --head "$FIX_BRANCH" \
                --base "$DEFAULT_BRANCH" \
                --draft \
                --title "[pipeline-fix] Automated fix for PR #$ORIGINAL_PR" \
                --body-file pr-body.md
            )"
          fi
          fix_number="${fix_url##*/}"
          gh api -X POST "repos/$REPOSITORY/issues/$fix_number/labels" \
            -f 'labels[]=automated' >/dev/null

          # gh-aw may have opened a fallback issue after the policy-blocked PR attempt.
          fallback="$(
            gh api --paginate \
              "repos/$REPOSITORY/issues?state=open&labels=automated&per_page=100" |
              jq -s --arg branch "$FIX_BRANCH" \
                '[.[][] | select(has("pull_request") | not)
                         | select((.body // "") | contains($branch))] | first | .number // empty'
          )"
          if [ -n "$fallback" ]; then
            gh issue close "$fallback" --repo "$REPOSITORY" \
              --comment "Superseded by #$fix_number." >/dev/null
          fi

          printf 'fix_number=%s\n' "$fix_number" >> "$GITHUB_OUTPUT"
          printf 'fix_url=%s\n' "$fix_url" >> "$GITHUB_OUTPUT"

      - name: Report fix and start validation
        if: steps.create.outputs.fix_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ORIGINAL_PR: ${{ needs.dispatch.outputs.original_pr }}
          FIX_NUMBER: ${{ steps.create.outputs.fix_number }}
          FIX_URL: ${{ steps.create.outputs.fix_url }}
          ANALYSIS_MARKER: "PR Pipeline Failure Analysis"
          FIX_SECTION_MARKER: "<!-- pipeline-analysis-fix -->"
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016

          {
            printf '%s\n\n' "$FIX_SECTION_MARKER"
            printf -- '---\n\n'
            printf '### Attempted Copilot Fix\n\n'
            printf 'PR: [#%s](%s) attempted to fix the pipeline failures found by the analysis.\n' \
              "$FIX_NUMBER" "$FIX_URL"
            printf '\n**Next steps:** Its pipelines are still running and this note will be '
            printf 'updated once they finish. The draft temporarily targets `%s` so Azure ' \
              "$DEFAULT_BRANCH"
            printf 'Pipelines runs; wait for validation and retargeting before merging.\n'
          } > addition.md

          comment_id="$(
            gh api --paginate \
              "repos/$REPOSITORY/issues/$ORIGINAL_PR/comments?per_page=100" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\")
                    | select(.body | contains(\"$ANALYSIS_MARKER\"))
                    | [.created_at, .id] | @tsv" |
              sort -r |
              awk -F'\t' 'NR == 1 { print $2 }'
          )"
          if [ -n "$comment_id" ]; then
            gh api "repos/$REPOSITORY/issues/comments/$comment_id" --jq '.body' > body.md
            awk -v marker="$FIX_SECTION_MARKER" 'index($0, marker) { exit } { print }' \
              body.md > trimmed.md
            cat trimmed.md addition.md > updated.md
            jq -Rs '{body: .}' updated.md |
              gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
          else
            {
              printf '%s\n\n' "$ANALYSIS_MARKER"
              cat addition.md
            } > recovered.md
            gh pr comment "$ORIGINAL_PR" --repo "$REPOSITORY" \
              --body-file recovered.md >/dev/null
          fi

          gh workflow run pipeline-analysis-e2e-v2-trigger.yml \
            --repo "$REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            -f fix_pr="$FIX_NUMBER"
          echo "Created $FIX_URL and dispatched validation."

  # A fix runs CI against the default branch, then moves to the original pull request branch.
  # The cron sweep recovers any whose dispatched validation timed out or was cancelled.
  validate:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.schedule == '*/30 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      checks: read
      pull-requests: write
    concurrency:
      group: pipeline-analysis-validate
      cancel-in-progress: false
    steps:
      - name: Report fixes whose CI has completed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_FIX_PR: ${{ inputs.fix_pr }}
          ANALYSIS_MARKER: "PR Pipeline Failure Analysis"
          FIX_SECTION_MARKER: "<!-- pipeline-analysis-fix -->"
        run: |
          set -euo pipefail

          rollups() {
            gh api --paginate "repos/$REPOSITORY/commits/$1/check-runs?per_page=100" \
              --jq '.check_runs[]
                    | select(.app.slug == "azure-pipelines")
                    | select(.name | contains(" (") | not)
                    | [.name, .status, .conclusion]
                    | @tsv'
          }

          azure_suite_statuses() {
            gh api --paginate "repos/$REPOSITORY/commits/$1/check-suites?per_page=100" \
              --jq '.check_suites[]
                    | select(.app.slug == "azure-pipelines")
                    | [.status, .conclusion]
                    | @tsv'
          }

          suites_complete() {
            local statuses
            statuses="$(azure_suite_statuses "$1")"
            [ -n "$statuses" ] &&
              ! awk -F'\t' '$1 != "completed" { incomplete = 1 } END { exit !incomplete }' \
                <<<"$statuses"
          }

          # Rewrites the fix section in place so the pull request keeps one analysis thread.
          set_fix_section() {
            local original_pr="$1" addition="$2" comment_id

            comment_id="$(
              gh api --paginate \
                "repos/$REPOSITORY/issues/$original_pr/comments?per_page=100" \
                --jq ".[] | select(.user.login == \"github-actions[bot]\")
                      | select(.body | contains(\"$ANALYSIS_MARKER\"))
                      | [.created_at, .id] | @tsv" |
                sort -r |
                awk -F'\t' 'NR == 1 { print $2 }'
            )"
            if [ -z "$comment_id" ]; then
              if [ -s "$addition" ]; then
                {
                  printf '%s\n\n' "$ANALYSIS_MARKER"
                  cat "$addition"
                } > recovered.md
                gh pr comment "$original_pr" --repo "$REPOSITORY" \
                  --body-file recovered.md >/dev/null
                echo "  posted a new comment on PR #$original_pr."
              fi
              return 0
            fi

            gh api "repos/$REPOSITORY/issues/comments/$comment_id" --jq '.body' > body.md
            awk -v marker="$FIX_SECTION_MARKER" 'index($0, marker) { exit } { print }' \
              body.md > trimmed.md
            cat trimmed.md "$addition" > updated.md
            if [ "$(cat updated.md)" = "$(cat body.md)" ]; then
              return 0
            fi
            jq -Rs '{body: .}' updated.md |
              gh api -X PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
            echo "  updated analysis comment $comment_id on PR #$original_pr."
          }

          # Returns 0 unconditionally: one unfinished fix must not fail the whole sweep.
          validate_fix() {
            local fix="$1" fix_pr fix_ref fix_sha base_ref original_pr original_sha
            local original original_ref failed_pipelines validated pipeline result
            local fresh_original fresh_fix retargeted

            fix_pr="$(jq -r '.number' <<<"$fix")"
            fix_ref="$(jq -r '.headRefName' <<<"$fix")"
            fix_sha="$(jq -r '.headRefOid' <<<"$fix")"
            base_ref="$(jq -r '.baseRefName' <<<"$fix")"

            if ! [[ "$fix_ref" =~ ^copilot-pipeline-fix/pr-([0-9]+)-([0-9a-f]{40})/ ]]; then
              return 0
            fi
            original_pr="${BASH_REMATCH[1]}"
            original_sha="${BASH_REMATCH[2]}"

            original="$(
              gh pr view "$original_pr" --repo "$REPOSITORY" \
                --json headRefName,headRefOid,state
            )"
            original_ref="$(jq -r '.headRefName' <<<"$original")"

            if [ "$(jq -r '.state' <<<"$original")" != OPEN ] ||
               [ "$(jq -r '.headRefOid' <<<"$original")" != "$original_sha" ]; then
              echo "#$fix_pr: original PR #$original_pr is closed or has moved past $original_sha."
              return 0
            fi

            if [ "$base_ref" != "$DEFAULT_BRANCH" ] && [ "$base_ref" != "$original_ref" ]; then
              echo "#$fix_pr: targets unexpected branch '$base_ref'; skipping."
              return 0
            fi

            if ! suites_complete "$original_sha"; then
              echo "#$fix_pr: original Azure Pipelines suites are not complete."
              return 0
            fi
            if ! suites_complete "$fix_sha"; then
              echo "#$fix_pr: fix Azure Pipelines suites are not complete."
              return 0
            fi

            rollups "$original_sha" > original-rollups.tsv
            rollups "$fix_sha" > fix-rollups.tsv
            if [ ! -s fix-rollups.tsv ]; then
              echo "#$fix_pr: no Azure Pipelines rollups found on $fix_sha."
              return 0
            fi

            # All fix rollups must be complete and green. Requiring the suites above to finish
            # prevents a temporarily complete subset from being mistaken for the final set.
            if awk -F'\t' \
                 '$2 != "completed" || $3 != "success" { failed = 1 } END { exit !failed }' \
                 fix-rollups.tsv; then
              {
                printf '%s\n\n' "$FIX_SECTION_MARKER"
                printf -- '---\n\n'
                printf '### Attempted Copilot Fix\n\n'
                printf 'PR: [#%s](%s) attempted to fix the pipeline failures found by the ' \
                  "$fix_pr" "$(jq -r '.url' <<<"$fix")"
                printf 'analysis, but failed.\n'
                printf '\n**Next steps:** Review the analysis above, or comment '
                # shellcheck disable=SC2016
                printf '`@copilot fix the pipeline failures` on this pull request to have Copilot '
                printf 'try again.\n'
              } > addition.md

              echo "#$fix_pr: at least one pipeline did not complete successfully."
              set_fix_section "$original_pr" addition.md
              return 0
            fi

            failed_pipelines="$(
              awk -F'\t' '$2 == "completed" && ($3 == "failure" || $3 == "timed_out") { print $1 }' \
                original-rollups.tsv
            )"
            if [ -z "$failed_pipelines" ]; then
              echo "#$fix_pr: no failed rollups recorded on $original_sha; nothing to validate."
              return 0
            fi

            validated=""
            while IFS= read -r pipeline; do
              [ -n "$pipeline" ] || continue
              result="$(
                awk -F'\t' -v name="$pipeline" \
                  '$1 == name && $2 == "completed" { print $3; exit }' fix-rollups.tsv
              )"
              if [ "$result" != success ]; then
                echo "#$fix_pr: '$pipeline' has not passed on the fix branch yet."
                return 0
              fi
              validated="${validated}- \`${pipeline}\`"$'\n'
            done <<<"$failed_pipelines"

            {
              printf '%s\n\n' "$FIX_SECTION_MARKER"
              printf -- '---\n\n'
              printf '### Attempted Copilot Fix\n\n'
              printf 'PR: [#%s](%s) attempted to fix the pipeline failures found by the ' \
                "$fix_pr" "$(jq -r '.url' <<<"$fix")"
              printf 'analysis. It successfully fixed the following pipelines:\n\n'
              printf '%s' "$validated"
              printf '\n**Next steps:** Review the change and merge it into this branch to pick '
              printf 'up the fix.\n'
            } > addition.md

            # Re-read both heads at the mutation boundary. A concurrent push invalidates every
            # check inspected above, so do not retarget or report success in that case.
            fresh_original="$(
              gh pr view "$original_pr" --repo "$REPOSITORY" \
                --json headRefName,headRefOid,state
            )"
            fresh_fix="$(
              gh pr view "$fix_pr" --repo "$REPOSITORY" \
                --json baseRefName,headRefOid,state
            )"
            if [ "$(jq -r '.state' <<<"$fresh_original")" != OPEN ] ||
               [ "$(jq -r '.headRefOid' <<<"$fresh_original")" != "$original_sha" ] ||
               [ "$(jq -r '.headRefName' <<<"$fresh_original")" != "$original_ref" ] ||
               [ "$(jq -r '.state' <<<"$fresh_fix")" != OPEN ] ||
               [ "$(jq -r '.headRefOid' <<<"$fresh_fix")" != "$fix_sha" ] ||
               { [ "$(jq -r '.baseRefName' <<<"$fresh_fix")" != "$DEFAULT_BRANCH" ] &&
                 [ "$(jq -r '.baseRefName' <<<"$fresh_fix")" != "$original_ref" ]; }; then
              echo "#$fix_pr: a pull request changed during validation; retrying later."
              return 0
            fi

            retargeted=false
            if [ "$(jq -r '.baseRefName' <<<"$fresh_fix")" = "$DEFAULT_BRANCH" ]; then
              gh api -X PATCH "repos/$REPOSITORY/pulls/$fix_pr" \
                -f base="$original_ref" >/dev/null
              retargeted=true
            fi

            fresh_original="$(
              gh pr view "$original_pr" --repo "$REPOSITORY" --json headRefOid,state
            )"
            fresh_fix="$(
              gh pr view "$fix_pr" --repo "$REPOSITORY" \
                --json baseRefName,headRefOid,state
            )"
            if [ "$(jq -r '.state' <<<"$fresh_original")" != OPEN ] ||
               [ "$(jq -r '.headRefOid' <<<"$fresh_original")" != "$original_sha" ] ||
               [ "$(jq -r '.state' <<<"$fresh_fix")" != OPEN ] ||
               [ "$(jq -r '.headRefOid' <<<"$fresh_fix")" != "$fix_sha" ] ||
               [ "$(jq -r '.baseRefName' <<<"$fresh_fix")" != "$original_ref" ]; then
              if [ "$retargeted" = true ]; then
                gh api -X PATCH "repos/$REPOSITORY/pulls/$fix_pr" \
                  -f base="$DEFAULT_BRANCH" >/dev/null
              fi
              echo "#$fix_pr: a pull request changed while retargeting; success was not reported."
              return 0
            fi

            echo "#$fix_pr: validated against '$DEFAULT_BRANCH' and targets '$original_ref'."
            set_fix_section "$original_pr" addition.md
            return 0
          }

          if [ -n "$TARGET_FIX_PR" ]; then
            # Azure Pipelines may not have queued yet, so wait for the rollups to complete.
            echo "Waiting for CI on fix pull request #$TARGET_FIX_PR..."
            for _ in $(seq 1 120); do
              sha="$(
                gh pr view "$TARGET_FIX_PR" --repo "$REPOSITORY" --json headRefOid \
                  --jq '.headRefOid'
              )"
              if suites_complete "$sha"; then
                echo "All Azure Pipelines suites have completed."
                break
              fi
              sleep 30
            done

            gh pr view "$TARGET_FIX_PR" --repo "$REPOSITORY" \
              --json number,baseRefName,headRefName,headRefOid,url,state \
              --jq 'select(.state == "OPEN")
                    | {number, baseRefName, headRefName, headRefOid, url}
                    | @json' > candidates.jsonl
          else
            gh pr list --repo "$REPOSITORY" --state open --limit 100 \
              --json number,baseRefName,headRefName,headRefOid,url \
              --jq '.[] | select(.headRefName | startswith("copilot-pipeline-fix/")) | @json' \
              > candidates.jsonl
          fi
          echo "Checking $(wc -l < candidates.jsonl) open fix pull requests."

          while IFS= read -r fix; do
            [ -n "$fix" ] || continue
            validate_fix "$fix"
          done < candidates.jsonl

  # Fix branches are cheap to recreate, so drop them once nothing open depends on them.
  cleanup:
    if: >
      (github.event_name == 'workflow_dispatch' && !inputs.fix_pr) ||
      github.event.schedule == '0 6 * * *'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete expired fix branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff="$(( $(date -u +%s) - 7 * 86400 ))"

          gh api --paginate \
            "repos/$REPOSITORY/git/matching-refs/heads/copilot-pipeline-fix/" \
            --jq '.[].ref' |
            sed 's#^refs/heads/##' |
            while read -r branch; do
              [ -n "$branch" ] || continue

              open_prs="$(
                gh pr list --repo "$REPOSITORY" --state open \
                  --head "$branch" --json number --jq length
              )"
              if [ "$open_prs" -gt 0 ]; then
                echo "keep   $branch (open PR)"
                continue
              fi

              committed="$(
                gh api "repos/$REPOSITORY/commits/$branch" \
                  --jq '.commit.committer.date' 2>/dev/null || true
              )"
              [ -n "$committed" ] || continue
              if [ "$(date -u -d "$committed" +%s)" -ge "$cutoff" ]; then
                echo "keep   $branch ($committed)"
                continue
              fi

              gh api -X DELETE "repos/$REPOSITORY/git/refs/heads/$branch"
              echo "delete $branch ($committed)"
            done
