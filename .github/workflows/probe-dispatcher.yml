name: Probe Dispatcher
on:
  workflow_dispatch:
permissions: {}
jobs:
  d:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch Probe A with GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run probe-a.yml --repo "${{ github.repository }}" --ref main
