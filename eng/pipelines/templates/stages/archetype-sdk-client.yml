parameters:
  - name: ServiceDirectory
    type: string
    default: not-specified
  - name: SkipPrValidation
    type: boolean
    default: false
  - name: Artifacts
    type: object
    default: []
  - name: TestPipeline
    type: boolean
    default: false
  - name: BeforeTestSteps
    type: object
    default: []
  - name: AfterTestSteps
    type: object
    default: []
  - name: ExcludePaths
    type: object
    default: []
  - name: BeforePublishSteps
    type: object
    default: []
  - name: TestMarkArgument
    type: string
    default: ''
  - name: BuildTargetingString
    type: string
    default: azure-*
  - name: TestTimeoutInMinutes
    type: number
    default: 60
  - name: InjectedPackages
    type: string
    default: ''
  - name: BuildDocs
    type: boolean
    default: true
  - name: DevFeedName
    type: string
    default: public/azure-sdk-for-python
  - name: PublicFeed
    type: string
    default: 'PyPi'
  - name: PublicPublishEnvironment
    type: string
    default: package-publish
  - name: TargetDocRepoOwner
    type: string
    default: MicrosoftDocs
  - name: TargetDocRepoName
    type: string
    default: azure-docs-sdk-python
  - name: MatrixConfigs
    type: object
    default:
      - Name: Python_ci_test_base
        Path: eng/pipelines/templates/stages/platform-matrix.json
        Selection: sparse
        GenerateVMJobs: true
  - name: AdditionalMatrixConfigs
    type: object
    default: []
  - name: MatrixFilters
    type: object
    default: []
  - name: MatrixReplace
    type: object
    default: []
  - name: VerifyAutorest
    type: boolean
    default: false
  - name: TestProxy
    type: boolean
    default: true
  - name: GenerateApiReviewForManualOnly
    type: boolean
    default: false
  - name: oneESTemplateTag
    type: string
    default: release
  - name: EnvVars
    type: object
    default: {}
  - name: DefaultBranch
    type: string
    default: main

extends:
  template: /eng/pipelines/templates/stages/1es-redirect.yml
  parameters:
    oneESTemplateTag: ${{ parameters.oneESTemplateTag }}
    stages:
      - stage: RetargetValidationGate
        displayName: Retarget validation gate
        condition: |
          and(
            eq(variables['Build.Reason'], 'PullRequest'),
            or(
              startsWith(variables['System.PullRequest.SourceBranch'], 'copilot-pipeline-fix/'),
              startsWith(variables['System.PullRequest.SourceBranch'], 'refs/heads/copilot-pipeline-fix/')
            ),
            ne(
              replace(variables['System.PullRequest.TargetBranch'], 'refs/heads/', ''),
              '${{ parameters.DefaultBranch }}'
            )
          )
        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml
        jobs:
          - job: CheckValidation
            displayName: Check validation
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            steps:
              - checkout: none
              - bash: |
                  set -euo pipefail
                  source_ref="$PR_SOURCE_REF"
                  source_ref="${source_ref#refs/heads/}"
                  target_ref="$PR_TARGET_REF"
                  target_ref="${target_ref#refs/heads/}"

                  skip=false
                  if [[ "$source_ref" =~ ^copilot-pipeline-fix/pr-([0-9]+)-([0-9a-f]{40})/ ]] &&
                     [ -n "$FIX_PR_NUMBER" ] && [[ "$FIX_PR_NUMBER" != *[!0-9]* ]]; then
                    original_pr="${BASH_REMATCH[1]}"
                    original_sha="${BASH_REMATCH[2]}"
                    repository_uri="$REPOSITORY_URI"
                    repository="${repository_uri#https://github.com/}"
                    repository="${repository%.git}"
                    repository="${repository%/}"
                    api="https://api.github.com/repos/$repository"
                    pr_json="$(curl -fsSL \
                      -H 'Accept: application/vnd.github+json' \
                      "$api/pulls/$original_pr" 2>/dev/null || true)"
                    fix_pr_json="$(curl -fsSL \
                      -H 'Accept: application/vnd.github+json' \
                      "$api/pulls/$FIX_PR_NUMBER" 2>/dev/null || true)"
                    source_sha="$(jq -r '.head.sha // empty' <<<"$fix_pr_json")"
                    checks_json="$(curl -fsSL \
                      -H 'Accept: application/vnd.github+json' \
                      "$api/commits/$source_sha/check-runs?per_page=100" 2>/dev/null || true)"

                    if [ -n "$pr_json" ] && [ -n "$fix_pr_json" ] &&
                       [ -n "$source_sha" ] && [ -n "$checks_json" ] &&
                       [ "$(jq -r '.state' <<<"$pr_json")" = "open" ] &&
                       [ "$(jq -r '.head.sha' <<<"$pr_json")" = "$original_sha" ] &&
                       [ "$(jq -r '.head.ref' <<<"$pr_json")" = "$target_ref" ] &&
                       [ "$(jq -r '.state' <<<"$fix_pr_json")" = "open" ] &&
                       [ "$(jq -r '.head.ref' <<<"$fix_pr_json")" = "$source_ref" ] &&
                       [ "$(jq -r '.base.ref' <<<"$fix_pr_json")" = "$target_ref" ] &&
                       jq -e '
                         any(.check_runs[];
                           .app.slug == "github-actions" and
                           .name == "Pipeline Analysis - Validated Fix" and
                           .conclusion == "success")
                       ' <<<"$checks_json" >/dev/null; then
                      skip=true
                    fi
                  fi

                  echo "skipDuplicateValidation=$skip"
                  echo "##vso[task.setvariable variable=skipDuplicateValidation;isOutput=true]$skip"
                name: checkValidation
                displayName: Verify validated-fix attestation
                env:
                  PR_SOURCE_REF: $(System.PullRequest.SourceBranch)
                  PR_TARGET_REF: $(System.PullRequest.TargetBranch)
                  FIX_PR_NUMBER: $(System.PullRequest.PullRequestNumber)
                  REPOSITORY_URI: $(Build.Repository.Uri)

      - stage: NoOp
        displayName: No-op
        dependsOn: RetargetValidationGate
        condition: |
          or(
            and(eq(${{ parameters.SkipPrValidation }}, true), eq(variables['Build.Reason'], 'Manual')),
            eq(
              dependencies.RetargetValidationGate.outputs['CheckValidation.checkValidation.skipDuplicateValidation'],
              'true'
            )
          )
        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml
        jobs:
          - job: NoOp
            displayName: No-op
            pool:
              name: $(LINUXPOOL)
              image: $(LINUXVMIMAGE)
              os: linux
            steps:
              - checkout: none
              - pwsh: |
                  if ('$(Build.Reason)' -eq 'Manual') {
                    Write-Host "PR validation skipped because SkipPrValidation was set for a manual run."
                  }
                  else {
                    Write-Host "The generated fix was already validated against ${{ parameters.DefaultBranch }}."
                    Write-Host "Skipping duplicate validation after retargeting to $env:PR_TARGET_REF."
                  }
                displayName: Skip duplicate PR validation
                env:
                  PR_TARGET_REF: $(System.PullRequest.TargetBranch)

      - stage: Build
        dependsOn:
          - RetargetValidationGate
          - NoOp
        condition: |
          and(
            not(and(eq(${{ parameters.SkipPrValidation }}, true), eq(variables['Build.Reason'], 'Manual'))),
            ne(
              dependencies.RetargetValidationGate.outputs['CheckValidation.checkValidation.skipDuplicateValidation'],
              'true'
            )
          )
        jobs:
          - template: /eng/pipelines/templates/jobs/ci.yml
            parameters:
              ServiceDirectory: ${{ parameters.ServiceDirectory }}
              Artifacts: ${{ parameters.Artifacts }}
              ${{ if eq(parameters.ServiceDirectory, 'template') }}:
                TestPipeline: true
              BeforeTestSteps: ${{ parameters.BeforeTestSteps }}
              AfterTestSteps: ${{ parameters.AfterTestSteps }}
              ExcludePaths: ${{ parameters.ExcludePaths }}
              BeforePublishSteps: ${{ parameters.BeforePublishSteps }}
              TestMarkArgument: ${{ parameters.TestMarkArgument }}
              BuildTargetingString: ${{ parameters.BuildTargetingString }}
              TestTimeoutInMinutes: ${{ parameters.TestTimeoutInMinutes }}
              InjectedPackages: ${{ parameters.InjectedPackages }}
              BuildDocs: ${{ parameters.BuildDocs }}
              DevFeedName: ${{ parameters.DevFeedName }}
              EnvVars: ${{ parameters.EnvVars }}
              MatrixConfigs:
                - ${{ each config in parameters.MatrixConfigs }}:
                    - ${{ config }}
                - ${{ each config in parameters.AdditionalMatrixConfigs }}:
                    - ${{ config }}
              MatrixFilters: ${{ parameters.MatrixFilters }}
              MatrixReplace: ${{ parameters.MatrixReplace }}
              VerifyAutorest: ${{ parameters.VerifyAutorest }}
              TestProxy: ${{ parameters.TestProxy }}
              GenerateApiReviewForManualOnly: ${{ parameters.GenerateApiReviewForManualOnly }}

        variables:
          - template: /eng/pipelines/templates/variables/globals.yml
          - template: /eng/pipelines/templates/variables/image.yml

      - template: archetype-python-release.yml
        parameters:
          DependsOn: "Build"
          ServiceDirectory: ${{ parameters.ServiceDirectory }}
          Artifacts: ${{ parameters.Artifacts }}
          ${{ if eq(parameters.ServiceDirectory, 'template') }}:
            TestPipeline: true
          ArtifactName: packages_extended
          DocArtifact: documentation
          TargetDocRepoOwner: ${{ parameters.TargetDocRepoOwner }}
          TargetDocRepoName: ${{ parameters.TargetDocRepoName }}
          DevFeedName: ${{ parameters.DevFeedName }}
          PublicFeed: ${{ parameters.PublicFeed }}
          PublicPublishEnvironment: ${{ parameters.PublicPublishEnvironment }}
